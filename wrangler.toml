name = "rio-impulso-digital"
compatibility_date = "2026-07-14"
pages_build_output_dir = "."

# D1 — RIO-110 sección 5/6. Base de desarrollo/preview creada el 28/08/2026
# (`wrangler d1 create rio-ventas-preview`, región ENAM). NO es la base de
# producción — esa no existe todavía y requiere aprobación expresa de Brenda.
[[d1_databases]]
binding = "DB"
database_name = "rio-ventas-preview"
database_id = "1aed8e43-6e47-40c9-9770-1c50f6586d20"
migrations_dir = "migrations"

# Variables públicas — no son secretos (confirmado en la auditoría RIO-108:
# el dominio de equipo de Access es un dato público, no un identificador de
# validación de tokens). El AUD de la aplicación de Access SÍ es sensible y
# se define como secreto, nunca acá — ver abajo.
[vars]
CF_ACCESS_TEAM_DOMAIN = "rio-impulsodigital-team.cloudflareaccess.com"

# Secretos requeridos (nombres únicamente — nunca el valor en este archivo
# ni en ningún archivo versionado):
#   CF_ACCESS_AUD   → wrangler pages secret put CF_ACCESS_AUD
#     (etiqueta AUD de la aplicación de Access "rioimpulsodigital.com",
#     visible solo en el panel de Cloudflare Access → Applications.)
#
# En desarrollo local, estos mismos nombres van en `.dev.vars` (ignorado por
# git — ver `.dev.vars.example` para el formato, sin valores reales).

# --- Entornos ---
# Preview (esta rama y cualquier otra que no sea main): CONFIGURADO el
# 28/08/2026 vía API sobre el proyecto real de Cloudflare — binding D1 "DB" →
# rio-ventas-preview + CF_ACCESS_TEAM_DOMAIN. Falta únicamente el secreto
# CF_ACCESS_AUD (Anthy no tiene permisos de Access/Zero Trust — ver RIO-109 —
# y no tiene el valor real). Pendiente: Brenda lo entrega por el mismo canal
# de archivo local usado para el token, y se carga con
# `wrangler pages secret put CF_ACCESS_AUD` (o Brenda lo carga directo desde
# el panel: Pages → rio-impulso-digital → Settings → Environment variables →
# Preview).
# Producción (rama main): esto SOLO se toca cuando RIO-110 esté aprobada y
# fusionada — no se modificó nada de producción en esta tarea (verificado:
# deployment_configs.production sigue exactamente igual que antes del PATCH).
